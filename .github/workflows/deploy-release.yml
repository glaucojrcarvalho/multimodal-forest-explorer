name: Deploy release to Vercel

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Validate real-data release bundle
        run: python scripts/check_real_data_release.py

      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "$VERCEL_DEPLOY_HOOK_URL"
