name: Generate package lock

on:
  push:
    branches:
      - issue-165-final-cleanup

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-165-final-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git commit -m "chore: add deterministic package lock"
          git push origin HEAD:issue-165-final-cleanup
